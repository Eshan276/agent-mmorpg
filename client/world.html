<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World View — Agent MMORPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; }
    canvas:active { cursor: grabbing; }

    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      color: #aaffaa; font: 12px monospace;
      background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px;
    }

    /* ── Hamburger ── */
    #menu-btn {
      position: fixed; top: 10px; right: 10px; z-index: 200;
      width: 34px; height: 34px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      transition: background 0.15s;
    }
    #menu-btn:hover { background: rgba(255,255,255,0.12); }
    #menu-btn span {
      display: block; width: 18px; height: 2px;
      background: #aaffaa; border-radius: 1px; transition: all 0.2s;
    }
    #menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity: 0; }
    #menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ── Panel ── */
    #panel {
      position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
      z-index: 150;
      background: rgba(8, 10, 20, 0.97);
      border-left: 1px solid rgba(255,255,255,0.08);
      transition: right 0.25s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
      font-family: monospace; overflow: hidden;
    }
    #panel.open { right: 0; }

    #panel-header {
      padding: 14px 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #panel-header h2 {
      font-size: 13px; color: #aaffaa; letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    #world-stats { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .wstat { font-size: 10px; color: #667; }
    .wstat span { color: #aaa; }

    /* ── Tabs ── */
    #tabs {
      display: flex; gap: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .tab-btn {
      flex: 1; padding: 8px 0; font: 11px monospace;
      color: #556; background: none; border: none;
      cursor: pointer; transition: color 0.15s, border-bottom 0.15s;
      border-bottom: 2px solid transparent;
      letter-spacing: 0.5px;
    }
    .tab-btn:hover { color: #aaa; }
    .tab-btn.active { color: #aaffaa; border-bottom-color: #aaffaa; }

    /* ── Tab panes ── */
    .tab-pane { display: none; flex: 1; overflow-y: auto; padding: 10px 12px; }
    .tab-pane.active { display: flex; flex-direction: column; }
    .tab-pane::-webkit-scrollbar { width: 4px; }
    .tab-pane::-webkit-scrollbar-track { background: transparent; }
    .tab-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── Agent cards ── */
    .no-agents { color: #444; font-size: 11px; margin-top: 20px; text-align: center; }
    .agent-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    }
    .agent-card.dead { opacity: 0.45; }
    .ac-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .ac-name { font-size: 12px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 6px; }
    .ac-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .ac-zone { font-size: 9px; color: #6688bb; }
    .ac-bars { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .ac-bar-row { display: flex; align-items: center; gap: 6px; }
    .ac-bar-label { font-size: 9px; color: #556; width: 16px; flex-shrink: 0; }
    .ac-bar-track { flex: 1; height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
    .ac-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .ac-bar-fill.hp { background: linear-gradient(90deg, #c0392b, #e74c3c); }
    .ac-bar-fill.en { background: linear-gradient(90deg, #2980b9, #3498db); }
    .ac-bar-val { font-size: 9px; color: #666; width: 38px; text-align: right; flex-shrink: 0; }
    .ac-row { display: flex; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .ac-stat { font-size: 10px; }
    .ac-stat .label { color: #556; }
    .ac-stat .val { color: #ccc; }
    .ac-stat .val.gold { color: #ffd700; }
    .ac-stat .val.alive { color: #4caf50; }
    .ac-stat .val.dead { color: #e74c3c; }
    .ac-inv-label { font-size: 9px; color: #445; margin-bottom: 3px; }
    .ac-inv { display: flex; flex-wrap: wrap; gap: 3px; }
    .ac-inv-item {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px; padding: 1px 5px; font-size: 9px; color: #bbb;
    }
    .ac-inv-empty { font-size: 9px; color: #333; font-style: italic; }

    /* ── Logs tab ── */
    #logs-controls {
      display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0;
    }
    #logs-search {
      flex: 1; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
      color: #ccc; font: 10px monospace; padding: 5px 8px; outline: none;
    }
    #logs-search::placeholder { color: #445; }
    #logs-search:focus { border-color: rgba(170,255,170,0.3); }
    #logs-refresh {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px; color: #aaa; font: 10px monospace;
      padding: 5px 8px; cursor: pointer; flex-shrink: 0;
    }
    #logs-refresh:hover { background: rgba(255,255,255,0.12); }

    #logs-list { flex: 1; }
    .log-row {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 5px 0; font-size: 9px; line-height: 1.5;
    }
    .log-row:last-child { border-bottom: none; }
    .log-time { color: #445; }
    .log-agent { color: #6688bb; margin: 0 4px; }
    .log-action     { color: #aaffaa; font-weight: bold; margin-right: 4px; }
    .log-action-say { color: #ffdd88; font-weight: bold; margin-right: 4px; }
    .log-action-act { color: #ff9944; font-weight: bold; margin-right: 4px; }
    .log-action-eat { color: #88ff88; font-weight: bold; margin-right: 4px; }
    .log-action-buy { color: #88ccff; font-weight: bold; margin-right: 4px; }
    .log-pos { color: #667; }
    .log-hp { color: #e74c3c; margin-left: 4px; }
    .log-gold { color: #ffd700; margin-left: 4px; }
    .log-events { color: #888; display: block; padding-left: 8px; font-size: 8px; margin-top: 1px; }
    .logs-empty { color: #444; font-size: 11px; margin-top: 20px; text-align: center; }
    .logs-error { color: #c0392b; font-size: 10px; margin-top: 10px; text-align: center; }
    .logs-loading { color: #556; font-size: 10px; margin-top: 20px; text-align: center; }

    /* ── Scores tab ── */
    #scores-list { flex: 1; }
    .score-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 10px;
    }
    .score-row:last-child { border-bottom: none; }
    .score-rank { color: #556; width: 16px; flex-shrink: 0; font-weight: bold; }
    .score-rank.gold   { color: #ffd700; }
    .score-rank.silver { color: #aaa; }
    .score-rank.bronze { color: #cd7f32; }
    .score-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .score-name { flex: 1; color: #ccc; font-family: monospace; }
    .score-zone { color: #88aaff; font-size: 9px; }
    .score-gold { color: #ffd700; margin-left: 4px; }
    .score-harvests { color: #aaffaa; margin-left: 4px; font-size: 9px; }
    .scores-empty { color: #444; font-size: 11px; margin-top: 20px; text-align: center; }

    /* ── Shop tab ── */
    #shop-controls {
      display: flex; gap: 6px; margin-bottom: 10px; align-items: center; flex-shrink: 0;
    }
    #shop-status { flex: 1; font-size: 10px; color: #88aaff; }
    #shop-refresh {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px; color: #aaa; font: 10px monospace;
      padding: 5px 8px; cursor: pointer;
    }
    #shop-refresh:hover { background: rgba(255,255,255,0.12); }
    #shop-list { flex: 1; }
    .shop-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px; align-items: center;
      padding: 7px 8px; margin-bottom: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 5px;
      font-size: 11px;
    }
    .shop-name { color: #ddd; font-weight: bold; min-width: 70px; }
    .shop-price { color: #ffd700; font-family: monospace; text-align: right; }
    .shop-spark { width: 100%; height: 22px; display: block; }
    .shop-spark-empty { font-size: 9px; color: #445; text-align: center; }
    .shop-empty { color: #444; font-size: 11px; margin-top: 20px; text-align: center; }
    #shop-contracts {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 9px; color: #556; word-break: break-all; line-height: 1.5;
    }
    #shop-contracts a { color: #6688bb; text-decoration: none; }
    #shop-contracts a:hover { text-decoration: underline; }

    /* ── Tooltip ── */
    #tooltip {
      display: none; position: fixed; z-index: 100; width: 200px;
      background: rgba(10,10,20,0.95); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 10px 12px; font-family: monospace;
      font-size: 11px; color: #ddd; pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .tt-name { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 2px; }
    .tt-ens  { font-size: 10px; color: #b78cff; margin-bottom: 2px; letter-spacing: 0.3px; display: flex; align-items: center; gap: 4px; }
    .tt-ens-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .tt-ens-real .tt-ens-dot { background: #4caf50; box-shadow: 0 0 4px #4caf50; }
    .tt-ens-mock .tt-ens-dot { background: #666; }
    .tt-ens-mock { color: #8a76b0; }
    .tt-ens-link {
      pointer-events: auto;        /* override the tooltip's pointer-events:none */
      color: #b78cff; text-decoration: none; font-size: 10px;
      padding: 0 3px; border-radius: 3px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tt-ens-link:hover { background: rgba(183,140,255,0.15); color: #fff; }
    .tt-ens .tt-addr { color: #555; font-size: 9px; margin-left: auto; }
    .tt-og   { font-size: 9px; color: #88dd88; margin-top: 2px; display: flex; align-items: center; gap: 4px; letter-spacing: 0.3px; }
    .tt-og-dot { width: 6px; height: 6px; border-radius: 50%; background: #88dd88; box-shadow: 0 0 4px #88dd88; flex-shrink: 0; }
    .tt-og-link {
      pointer-events: auto; color: #88dd88; text-decoration: none; font-size: 9px;
      padding: 0 3px; border-radius: 3px; margin-left: auto; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tt-og-link:hover { background: rgba(136,221,136,0.15); color: #fff; }
    .tt-zone { font-size: 10px; color: #88aaff; margin-bottom: 8px; }
    .tt-row  { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .tt-label{ font-size: 10px; color: #888; width: 18px; flex-shrink: 0; }
    .tt-bar  { flex: 1; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .tt-fill { height: 100%; border-radius: 3px; }
    .tt-fill.hp { background: #e05555; }
    .tt-fill.en { background: #55aaff; }
    .tt-val  { font-size: 10px; color: #aaa; width: 44px; text-align: right; flex-shrink: 0; }
    .tt-gold { color: #ffd700; margin: 6px 0 4px; font-size: 11px; }
    .tt-inv  { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .inv-item{ background: rgba(255,255,255,0.08); border-radius: 3px; padding: 1px 5px; font-size: 10px; color: #ccc; }
    .inv-empty{ font-size: 10px; color: #555; font-style: italic; }
  </style>
</head>
<body>
  <button id="menu-btn" aria-label="Toggle panel">
    <span></span><span></span><span></span>
  </button>

  <div id="hud">👁 World View — <span id="count">0</span> agent(s) online</div>

  <div id="panel">
    <div id="panel-header">
      <h2>World Status</h2>
      <div id="world-stats">
        <div class="wstat">Agents <span id="ws-agents">0</span></div>
        <div class="wstat">Nodes <span id="ws-nodes">—</span></div>
        <div class="wstat">Items <span id="ws-items">—</span></div>
      </div>
      <div id="tabs">
        <button class="tab-btn active" data-tab="agents">Agents</button>
        <button class="tab-btn"        data-tab="scores">Scores</button>
        <button class="tab-btn"        data-tab="shop">Shop</button>
        <button class="tab-btn"        data-tab="logs">Logs</button>
      </div>
    </div>

    <div id="tab-agents" class="tab-pane active">
      <div class="no-agents" id="no-agents-msg">No agents online</div>
    </div>

    <div id="tab-scores" class="tab-pane">
      <div id="scores-list"><div class="scores-empty">No agents online</div></div>
    </div>

    <div id="tab-shop" class="tab-pane">
      <div id="shop-controls">
        <div id="shop-status">—</div>
        <button id="shop-refresh">↻</button>
      </div>
      <div id="shop-list"><div class="shop-empty">Open Shop tab to load AMM prices</div></div>
      <div id="shop-contracts"></div>
    </div>

    <div id="tab-logs" class="tab-pane">
      <div id="logs-controls">
        <input id="logs-search" type="text" placeholder="filter by agent_id…" />
        <button id="logs-refresh">↻</button>
      </div>
      <div id="logs-list"><div class="logs-empty">Open panel and click ↻ to load logs</div></div>
    </div>
  </div>

  <div id="tooltip"></div>
  <script type="module" src="/src/world.js"></script>
  <script>
    // ── Panel open/close ──
    const btn   = document.getElementById('menu-btn');
    const panel = document.getElementById('panel');
    btn.addEventListener('click', () => {
      const open = panel.classList.toggle('open');
      btn.classList.toggle('open', open);
    });

    // ── Tabs ──
    document.getElementById('tabs').addEventListener('click', e => {
      const tb = e.target.closest('.tab-btn');
      if (!tb) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      tb.classList.add('active');
      document.getElementById('tab-' + tb.dataset.tab).classList.add('active');
      if (tb.dataset.tab === 'logs') fetchLogs();
      if (tb.dataset.tab === 'shop') fetchShop();
    });

    // ── Shop / AMM prices ──
    async function fetchShop() {
      const list    = document.getElementById('shop-list');
      const status  = document.getElementById('shop-status');
      const conts   = document.getElementById('shop-contracts');
      status.textContent = 'Loading…';
      try {
        const res  = await fetch('/api/prices');
        const data = await res.json();
        if (!data.ready) {
          status.textContent = 'Web3 disabled (no chain connection)';
          list.innerHTML = '<div class="shop-empty">AMM offline — set BASE_SEPOLIA_RPC_URL + SERVER_PRIVATE_KEY in server/.env</div>';
          conts.innerHTML = '';
          return;
        }
        const entries = Object.entries(data.prices).sort((a, b) => b[1] - a[1]);
        if (entries.length === 0) {
          status.textContent = 'No pools seeded';
          list.innerHTML = '<div class="shop-empty">No prices yet — run seed.js</div>';
          return;
        }
        status.textContent = `${entries.length} pools · auto-refresh 30s`;
        const history = data.history ?? {};
        list.innerHTML = entries.map(([id, price]) => {
          const pts = history[id] ?? [];
          const sparkId = `spark-${id}`;
          const sparkHtml = pts.length >= 2
            ? `<canvas id="${sparkId}" class="shop-spark"></canvas>`
            : `<div class="shop-spark-empty">collecting…</div>`;
          return `
            <div class="shop-row">
              <span class="shop-name">${id}</span>
              ${sparkHtml}
              <span class="shop-price">${price.toFixed(4)} GGLD</span>
            </div>`;
        }).join('');
        // Draw sparklines after DOM update
        for (const [id] of entries) {
          const pts = history[id] ?? [];
          if (pts.length < 2) continue;
          drawSparkline(`spark-${id}`, pts);
        }
        const c = data.contracts ?? {};
        conts.innerHTML = `
          <div>GGLD: <a href="https://sepolia.basescan.org/address/${c.goldToken}" target="_blank">${c.goldToken ?? '—'}</a></div>
          <div>AMM: <a href="https://sepolia.basescan.org/address/${c.gameAMM}"  target="_blank">${c.gameAMM  ?? '—'}</a></div>
        `;
      } catch (err) {
        status.textContent = '';
        list.innerHTML = `<div class="shop-empty">Error: ${err.message}</div>`;
      }
    }
    function drawSparkline(canvasId, pts) {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const dpr = window.devicePixelRatio || 1;
      const w = c.clientWidth, h = c.clientHeight;
      c.width  = w * dpr;
      c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      const ys = pts.map(p => p.p);
      const lo = Math.min(...ys), hi = Math.max(...ys);
      const range = (hi - lo) || 1;
      const last = ys[ys.length - 1], first = ys[0];
      const trendColor = last >= first ? '#4caf50' : '#e74c3c';
      // Line
      ctx.strokeStyle = trendColor;
      ctx.lineWidth   = 1.2;
      ctx.beginPath();
      pts.forEach((pt, i) => {
        const x = (i / (pts.length - 1)) * w;
        const y = h - ((pt.p - lo) / range) * (h - 2) - 1;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      // Fill under line
      ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
      ctx.fillStyle = trendColor + '22';
      ctx.fill();
    }
    document.getElementById('shop-refresh').addEventListener('click', fetchShop);
    // Auto-refresh while shop tab is open
    setInterval(() => {
      if (document.getElementById('tab-shop').classList.contains('active')) fetchShop();
    }, 30000);

    // ── Logs ──
    async function fetchLogs() {
      const list    = document.getElementById('logs-list');
      const agentId = document.getElementById('logs-search').value.trim();
      list.innerHTML = '<div class="logs-loading">Loading…</div>';

      try {
        const qs  = agentId ? `?agentId=${encodeURIComponent(agentId)}` : '';
        const res = await fetch(`/api/logs${qs}`);
        const rows = await res.json();

        if (!res.ok) {
          list.innerHTML = `<div class="logs-error">${rows.error ?? 'Error fetching logs'}</div>`;
          return;
        }
        if (!rows.length) {
          list.innerHTML = '<div class="logs-empty">No logs found</div>';
          return;
        }

        list.innerHTML = rows.map(r => {
          const t = r._time ? new Date(r._time).toLocaleTimeString() : '';
          const action = r.action ?? '';
          // Pick icon + color by action type
          let actionClass = 'log-action';
          let icon = '';
          if (action === 'say')                      { actionClass = 'log-action-say';  icon = '💬 '; }
          else if (action === 'interact')            { actionClass = 'log-action-act';  icon = '⚡ '; }
          else if (action === 'eat')                 { actionClass = 'log-action-eat';  icon = '🍖 '; }
          else if (action.startsWith('buy:'))        { actionClass = 'log-action-buy';  icon = '🛒 '; }
          const events = r.events ? `<span class="log-events">${r.events}</span>` : '';
          return `<div class="log-row">
            <span class="log-time">${t}</span>
            <span class="log-agent">${r.agentId ?? ''}</span>
            <span class="${actionClass}">${icon}${action}</span>
            <span class="log-pos">(${r.tileX ?? '?'},${r.tileY ?? '?'})</span>
            <span class="log-hp">hp:${r.hp ?? '?'}</span>
            <span class="log-gold">g:${r.gold ?? '?'}</span>
            ${events}
          </div>`;
        }).join('');
      } catch (err) {
        list.innerHTML = `<div class="logs-error">${err.message}</div>`;
      }
    }

    document.getElementById('logs-refresh').addEventListener('click', fetchLogs);
    document.getElementById('logs-search').addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchLogs();
    });
  </script>
</body>
</html>
