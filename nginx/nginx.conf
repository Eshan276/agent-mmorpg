worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Required for Socket.io websocket upgrades
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Trust the docker bridge network
  set_real_ip_from 172.16.0.0/12;
  real_ip_header   X-Forwarded-For;

  upstream agent_mmorpg {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Reasonable upload limit (mostly for /api/* JSON anyway)
    client_max_body_size 1m;

    # Compression for JS/JSON/HTML
    gzip on;
    gzip_types
      text/plain text/css text/javascript application/javascript
      application/json image/svg+xml;
    gzip_min_length 1024;

    # Socket.io — both polling and websocket upgrade paths land here
    location /socket.io/ {
      proxy_pass http://agent_mmorpg;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Long-lived connections — no timeouts
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Everything else (API + static client) goes to the app
    location / {
      proxy_pass http://agent_mmorpg;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
